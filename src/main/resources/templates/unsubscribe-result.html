<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Désinscription newsletter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #444;
            line-height: 1.5;
        }
        .success {
            color: #1b7f3a;
        }
        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
<div class="card">
    <div th:if="${success}">
        <h1 class="success">Désinscription confirmée</h1>
        <p>Vous ne recevrez plus nos emails. Cette action a bien été prise en compte.</p>
    </div>
    <div th:unless="${success}">
        <h1 class="error">Lien invalide ou expiré</h1>
        <p>Ce lien de désinscription n'est pas valide. Si le problème persiste, contactez-nous.</p>
    </div>
</div>
</body>
</html>
