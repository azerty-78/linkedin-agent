# ========================================
# APPLICATION
# ========================================
spring.application.name=linkedin-agent
server.port=8080

# ========================================
# SPRING AI — placeholders auto-config uniquement
# Clés / modèles runtime = PUT /api/settings (front), pas ici.
# ========================================
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# ========================================
# AI — défauts pour /api/ai/generate-test uniquement
# ========================================
ai.test.max-output-tokens=80
ai.test.openai-model=gpt-4.1-nano
ai.test.anthropic-model=claude-haiku-4-5
ai.test.gemini-model=gemini-3.1-flash-lite
ai.test.prefer-gemini=true

# ========================================
# MONGODB REACTIF
# ========================================
spring.mongodb.uri=${MONGODB_URI:mongodb://devroot:devpass@localhost:27017/linkedin_agent_db?authSource=admin}
spring.mongodb.database=linkedin_agent_db
spring.data.mongodb.auto-index-creation=true

# ========================================
# EMAIL - SMTP
# ========================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:placeholder}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-min-32-characters-long}
jwt.expiration=86400000

# ========================================
# BOOTSTRAP ADMIN
# ========================================
app.bootstrap.admin-email=${ADMIN_EMAIL:bendjibril789@gmail.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:BenDjibril78\#}

# ========================================
# ENCRYPTION (AES-256 — clés API en base)
# Dev: fixed default so encrypted keys survive restarts.
# Override with ENCRYPTION_KEY (Base64 of exactly 32 bytes). Generate: openssl rand -base64 32
# ========================================
app.encryption.key=${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ========================================
# SCHEDULER
# ========================================
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-

# ========================================
# FRONTEND (OAuth redirects) + CORS
# ========================================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ========================================
# LINKEDIN (non-secret defaults only)
# Client ID / secret → stockés en DB via PUT /api/settings (chiffrés)
# En local : callback localhost. En prod : voir application-prod.properties
# ========================================
linkedin.default-redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/linkedin/callback}
linkedin.default-oauth-scopes=${LINKEDIN_OAUTH_SCOPES:w_organization_social r_organization_social}
linkedin.api-base-url=https://api.linkedin.com/v2
linkedin.rest-api-base-url=https://api.linkedin.com/rest
linkedin.api-version=${LINKEDIN_API_VERSION:202604}

# ========================================
# WEBCLIENT (appels externes)
# ========================================
spring.webflux.timeout=30000
webclient.connection-timeout=10000
webclient.response-timeout=30000

# ========================================
# ACTUATOR - MONITORING
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.name=LinkedIn Agent
info.app.version=1.0.0

# ========================================
# LOGS
# ========================================
logging.level.root=INFO
logging.level.com.revolut.agent=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n


