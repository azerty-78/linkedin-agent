# ========================================
# APPLICATION
# ========================================
spring.application.name=linkedin-agent
server.port=8080

# ========================================
# SPRING AI - ANTHROPIC CLAUDE
# ========================================
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:sk-placeholder-to-replace}
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder-to-replace}
spring.ai.anthropic.chat.model=claude-sonnet-4-6
spring.ai.anthropic.chat.max-tokens=2048
spring.ai.anthropic.chat.temperature=0.7

# ========================================
# MONGODB REACTIF
# ========================================
spring.mongodb.uri=${MONGODB_URI:mongodb://devroot:devpass@localhost:27017/linkedin_agent_db?authSource=admin}
spring.mongodb.database=linkedin_agent_db
spring.data.mongodb.auto-index-creation=true

# ========================================
# EMAIL - SMTP
# ========================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:placeholder}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-min-32-characters-long}
jwt.expiration=86400000

# ========================================
# BOOTSTRAP ADMIN
# ========================================
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@localhost}
app.bootstrap.admin-password=${ADMIN_PASSWORD:ChangeMe123!}

# ========================================
# ENCRYPTION (AES-256 — clés API en base)
# ========================================
app.encryption.key=${ENCRYPTION_KEY:}

# ========================================
# SCHEDULER
# ========================================
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-

# ========================================
# LINKEDIN API
# ========================================
linkedin.client-id=${LINKEDIN_CLIENT_ID:}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
linkedin.access-token=${LINKEDIN_ACCESS_TOKEN:}
linkedin.organization-id=${LINKEDIN_ORGANIZATION_ID:}
linkedin.api-base-url=https://api.linkedin.com/v2

# ========================================
# WEBCLIENT (appels externes)
# ========================================
spring.webflux.timeout=30000
webclient.connection-timeout=10000
webclient.response-timeout=30000

# ========================================
# ACTUATOR - MONITORING
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.name=LinkedIn Agent
info.app.version=1.0.0

# ========================================
# LOGS
# ========================================
logging.level.root=INFO
logging.level.com.revolut.agent=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


