# ========================================
# APPLICATION
# ========================================
spring.application.name=linkedin-agent
server.port=8080

# ========================================
# SPRING AI (auto-config placeholders only)
# Informative / unused by the dynamic ChatModel flow in AiGenerationService.
# Runtime keys come from /api/settings (encrypted), models from ai.*.model below.
# ========================================
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:sk-placeholder-to-replace}
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder-to-replace}
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.max-tokens=2048
spring.ai.anthropic.chat.temperature=0.7

# ========================================
# AI MODELS — fallbacks if org settings omit model
# Prefer free/cheap defaults for local tests (override per org via /api/settings).
# ========================================
ai.openai.model=${AI_OPENAI_MODEL:gpt-4o-mini}
ai.anthropic.model=${AI_ANTHROPIC_MODEL:claude-haiku-4-5}
ai.anthropic.max-tokens=1024
ai.gemini.model=${AI_GEMINI_MODEL:gemini-3.5-flash}
ai.gemini.api-base-url=https://generativelanguage.googleapis.com/v1beta
ai.gemini.max-output-tokens=1024
ai.max-output-tokens=1024
# Tests manuels (/api/ai/generate-test) — modèles faibles, indépendants des settings UI
ai.test.max-output-tokens=80
ai.test.openai-model=gpt-4.1-nano
ai.test.anthropic-model=claude-haiku-4-5
ai.test.gemini-model=gemini-3.1-flash-lite
ai.test.prefer-gemini=true

# ========================================
# MONGODB REACTIF
# ========================================
spring.mongodb.uri=${MONGODB_URI:mongodb://devroot:devpass@localhost:27017/linkedin_agent_db?authSource=admin}
spring.mongodb.database=linkedin_agent_db
spring.data.mongodb.auto-index-creation=true

# ========================================
# EMAIL - SMTP
# ========================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:placeholder}
spring.mail.password=${MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========================================
# JWT
# ========================================
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-min-32-characters-long}
jwt.expiration=86400000

# ========================================
# BOOTSTRAP ADMIN
# ========================================
app.bootstrap.admin-email=${ADMIN_EMAIL:bendjibril789@gmail.com}
app.bootstrap.admin-password=${ADMIN_PASSWORD:BenDjibril78\#}

# ========================================
# ENCRYPTION (AES-256 — clés API en base)
# Dev: fixed default so encrypted keys survive restarts.
# Override with ENCRYPTION_KEY (Base64 of exactly 32 bytes). Generate: openssl rand -base64 32
# ========================================
app.encryption.key=${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# ========================================
# SCHEDULER
# ========================================
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-

# ========================================
# FRONTEND (OAuth redirects)
# ========================================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ========================================
# LINKEDIN OAUTH2 (secrets via env / setup/.env — pas de défauts sensibles ici)
# App Community Management (dédiée Page) : client-id/secret de l'APP B uniquement
# ========================================
linkedin.client-id=${LINKEDIN_CLIENT_ID:78zid5ybpzg2jd}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:WPL_AP1.e9PNFGOlXqCcsNYm.1MNn/g==}
linkedin.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/linkedin/callback}
linkedin.oauth-scopes=${LINKEDIN_OAUTH_SCOPES:w_organization_social r_organization_social}
linkedin.api-base-url=https://api.linkedin.com/v2
linkedin.rest-api-base-url=https://api.linkedin.com/rest
linkedin.api-version=${LINKEDIN_API_VERSION:202604}

# ========================================
# WEBCLIENT (appels externes)
# ========================================
spring.webflux.timeout=30000
webclient.connection-timeout=10000
webclient.response-timeout=30000

# ========================================
# ACTUATOR - MONITORING
# ========================================
management.endpoints.web.exposure.include=health,info,metrics,scheduledtasks
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.name=LinkedIn Agent
info.app.version=1.0.0

# ========================================
# LOGS
# ========================================
logging.level.root=INFO
logging.level.com.revolut.agent=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n


