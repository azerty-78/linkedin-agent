# =============================================================================
# Production — Revolut LinkedIn Agent (API + MongoDB)
# Déployé sur le VPS dans : ~/kobe-corporation/revolut-agent/api/
#
# nginx (hôte) :
#   agent-rev-api.kobecorporation.com  → http://127.0.0.1:4005
#   agent-rev-front.kobecorporation.com → http://127.0.0.1:4004  (front, hors de ce compose)
#
# Prérequis : fichier .env à côté de ce compose (secrets manuels sur le VPS).
# Usage :
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d
# =============================================================================

services:
  mongodb:
    image: mongo:7
    container_name: revolut-agent-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-linkedin_agent_db}
    volumes:
      - revolut_agent_mongodb_data:/data/db
    # Pas d'exposition publique : uniquement réseau Docker interne
    networks:
      - revolut-agent
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${REVOLUT_AGENT_API_IMAGE:?REVOLUT_AGENT_API_IMAGE requis (ex. user/revolut-agent-api:tag)}
    container_name: revolut-agent-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      # nginx → 127.0.0.1:4005 → conteneur :8080
      - "127.0.0.1:4005:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI requis}
      MONGO_DATABASE: ${MONGO_DATABASE:-linkedin_agent_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requis}
      FRONTEND_URL: ${FRONTEND_URL:-https://agent-rev-front.kobecorporation.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://agent-rev-front.kobecorporation.com}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-https://agent-rev-api.kobecorporation.com/api/linkedin/callback}
      LINKEDIN_OAUTH_SCOPES: ${LINKEDIN_OAUTH_SCOPES:-openid profile email w_member_social}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202604}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - revolut-agent
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health/liveness >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  revolut-agent:
    driver: bridge

volumes:
  revolut_agent_mongodb_data:
